<!DOCTYPE html>
<!-- 单文件版：由 tools/build-single.mjs 从 index.html / styles.css / timer-core.js / app.js 生成，勿直接修改 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#141018" />
  <meta name="description" content="一个干净、专注的番茄时钟：专注 25 分钟，休息 5 分钟，自动循环并记录你的番茄数。" />
  <title>番茄时钟 · Pomodoro</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%85%3C/text%3E%3C/svg%3E" />
  <style>
/* ==========================================================================
   番茄时钟 —— 样式
   阶段主题色通过 <body data-phase="focus|short|long"> 切换
   ========================================================================== */

:root {
  --bg: #14101a;
  --bg-soft: #1d1725;
  --surface: rgba(255, 255, 255, 0.045);
  --surface-strong: rgba(255, 255, 255, 0.08);
  --border: rgba(255, 255, 255, 0.1);
  --text: #f4f1f8;
  --text-dim: #a49cb4;
  --text-faint: #7a7288;

  --accent: #ff6b5b;
  --accent-2: #ff9f43;

  --radius: 20px;
  --shadow: 0 24px 60px rgba(0, 0, 0, 0.45);

  --ring-size: 320px;
  --ring-circumference: 892.21; /* 2 * π * 142 */
}

body[data-phase='short'] {
  --accent: #34d399;
  --accent-2: #22d3ee;
}

body[data-phase='long'] {
  --accent: #818cf8;
  --accent-2: #38bdf8;
}

* {
  box-sizing: border-box;
}

html {
  height: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  padding: clamp(16px, 4vw, 40px) 16px calc(28px + env(safe-area-inset-bottom));
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
    'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  color: var(--text);
  background:
    radial-gradient(120% 90% at 15% 0%, color-mix(in oklab, var(--accent) 22%, transparent), transparent 60%),
    radial-gradient(110% 80% at 100% 100%, color-mix(in oklab, var(--accent-2) 18%, transparent), transparent 55%),
    linear-gradient(170deg, var(--bg-soft), var(--bg) 60%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
  transition: background 600ms ease;
}

/* 背景柔光，随时间缓慢呼吸 */
.glow {
  position: fixed;
  inset: -20vmax;
  z-index: -1;
  pointer-events: none;
  background: radial-gradient(circle at 50% 45%, color-mix(in oklab, var(--accent) 26%, transparent), transparent 42%);
  opacity: 0.75;
  filter: blur(30px);
  animation: breathe 9s ease-in-out infinite;
  transition: background 600ms ease;
}

@keyframes breathe {
  0%, 100% { transform: scale(1); opacity: 0.6; }
  50% { transform: scale(1.08); opacity: 0.85; }
}

.app {
  width: min(560px, 100%);
  display: flex;
  flex-direction: column;
  gap: clamp(18px, 3vh, 30px);
}

/* ---------------------------------------------------------------- 顶栏 -- */

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0;
  font-size: 1.05rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--text-dim);
}

.brand__tomato {
  font-size: 1.25rem;
  filter: drop-shadow(0 4px 14px color-mix(in oklab, var(--accent) 60%, transparent));
}

/* --------------------------------------------------------- 通用按钮 -- */

.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 42px;
  height: 42px;
  padding: 0;
  color: var(--text-dim);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 50%;
  cursor: pointer;
  transition: color 160ms ease, background 160ms ease, transform 160ms ease, border-color 160ms ease;
}

.icon-btn:hover {
  color: var(--text);
  background: var(--surface-strong);
  border-color: color-mix(in oklab, var(--accent) 45%, transparent);
}

.icon-btn:active {
  transform: scale(0.94);
}

.icon-btn--ghost {
  background: transparent;
  border-color: transparent;
}

.icon-btn--ghost:hover {
  background: var(--surface);
}

/* --------------------------------------------------------- 模式切换 -- */

.modes {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  padding: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
}

.mode {
  padding: 9px 6px;
  font: inherit;
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--text-faint);
  background: transparent;
  border: 0;
  border-radius: 999px;
  cursor: pointer;
  transition: color 160ms ease, background 200ms ease, box-shadow 200ms ease;
}

.mode:hover { color: var(--text-dim); }

.mode[aria-selected='true'] {
  color: #17121d;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  box-shadow: 0 8px 22px color-mix(in oklab, var(--accent) 40%, transparent);
}

/* ------------------------------------------------------------- 表盘 -- */

.stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(14px, 2.5vh, 24px);
}

.dial {
  position: relative;
  width: min(var(--ring-size), 78vw);
  aspect-ratio: 1;
  display: grid;
  place-items: center;
}

.ring {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
  overflow: visible;
}

.ring__track {
  fill: none;
  stroke: rgba(255, 255, 255, 0.07);
  stroke-width: 14;
}

.ring__progress {
  fill: none;
  stroke: url(#ringGradient);
  stroke-width: 14;
  stroke-linecap: round;
  stroke-dasharray: var(--ring-circumference);
  stroke-dashoffset: 0;
  filter: drop-shadow(0 0 12px color-mix(in oklab, var(--accent) 55%, transparent));
}

.dial__center {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  text-align: center;
}

.dial__phase {
  margin: 0;
  font-size: 0.9rem;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--text-dim);
}

.dial__time {
  margin: 0;
  font-size: clamp(3.4rem, 15vw, 4.6rem);
  font-weight: 700;
  line-height: 1;
  letter-spacing: 0.01em;
  font-variant-numeric: tabular-nums;
  font-feature-settings: 'tnum' 1;
  text-shadow: 0 10px 40px color-mix(in oklab, var(--accent) 35%, transparent);
}

.dial__hint {
  margin: 0;
  font-size: 0.86rem;
  color: var(--text-faint);
}

body.is-running .dial__time {
  color: #fff;
}

/* ------------------------------------------------------------- 控制区 -- */

.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(10px, 3vw, 20px);
}

.primary-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-width: 168px;
  height: 58px;
  padding: 0 30px;
  font: inherit;
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  color: #17121d;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border: 0;
  border-radius: 999px;
  cursor: pointer;
  box-shadow: 0 14px 34px color-mix(in oklab, var(--accent) 38%, transparent);
  transition: transform 160ms ease, box-shadow 220ms ease, filter 220ms ease;
}

.primary-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 18px 42px color-mix(in oklab, var(--accent) 50%, transparent);
}

.primary-btn:active {
  transform: translateY(0) scale(0.98);
}

.primary-btn__icon--pause,
.primary-btn__icon--play {
  display: block;
}

/* 运行时显示暂停图标 */
.primary-btn__icon--pause { display: none; }
body.is-running .primary-btn__icon--play { display: none; }
body.is-running .primary-btn__icon--pause { display: block; }

/* --------------------------------------------------------------- 进度 -- */

.meta {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 16px 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.meta__row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
}

.dots {
  display: flex;
  gap: 7px;
}

.dot {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid var(--border);
  transition: background 260ms ease, transform 260ms ease, box-shadow 260ms ease;
}

.dot.is-filled {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border-color: transparent;
  transform: scale(1.12);
  box-shadow: 0 0 12px color-mix(in oklab, var(--accent) 60%, transparent);
}

.meta__count {
  margin: 0;
  font-size: 0.86rem;
  color: var(--text-dim);
}

.meta__count strong {
  font-size: 1.05rem;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}

.task {
  display: flex;
  align-items: center;
  gap: 12px;
}

.task__label {
  flex: none;
  font-size: 0.8rem;
  letter-spacing: 0.08em;
  color: var(--text-faint);
}

.task__input {
  flex: 1;
  min-width: 0;
  padding: 9px 12px;
  font: inherit;
  font-size: 0.9rem;
  color: var(--text);
  background: rgba(0, 0, 0, 0.22);
  border: 1px solid var(--border);
  border-radius: 12px;
  transition: border-color 160ms ease, background 160ms ease;
}

.task__input::placeholder { color: var(--text-faint); }

.task__input:focus {
  outline: none;
  background: rgba(0, 0, 0, 0.32);
  border-color: color-mix(in oklab, var(--accent) 55%, transparent);
}

/* ------------------------------------------------------------- 快捷键 -- */

.shortcuts {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  flex-wrap: wrap;
  font-size: 0.75rem;
  color: var(--text-faint);
}

.shortcuts__sep { opacity: 0.5; }

kbd {
  display: inline-block;
  min-width: 20px;
  padding: 2px 6px;
  font: inherit;
  font-size: 0.72rem;
  text-align: center;
  color: var(--text-dim);
  background: var(--surface);
  border: 1px solid var(--border);
  border-bottom-width: 2px;
  border-radius: 6px;
}

/* --------------------------------------------------------------- 面板 -- */

.scrim {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(8, 6, 12, 0.6);
  backdrop-filter: blur(3px);
  opacity: 0;
  transition: opacity 220ms ease;
}

.scrim.is-open { opacity: 1; }

.panel {
  position: fixed;
  z-index: 21;
  top: 50%;
  left: 50%;
  width: min(440px, calc(100vw - 32px));
  max-height: min(86vh, 780px);
  overflow-y: auto;
  background: linear-gradient(170deg, #241d2e, #1a1523);
  border: 1px solid var(--border);
  border-radius: 24px;
  box-shadow: var(--shadow);
  transform: translate(-50%, -50%) scale(0.96);
  opacity: 0;
  transition: opacity 220ms ease, transform 220ms cubic-bezier(0.2, 0.9, 0.3, 1.2);
}

.panel.is-open {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

.panel__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 20px 12px;
}

.panel__head h2 {
  margin: 0;
  font-size: 1.1rem;
  letter-spacing: 0.03em;
}

.panel__body {
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 4px 20px 22px;
}

.field-group {
  margin: 0;
  padding: 0;
  border: 0;
}

.field-group legend {
  padding: 0 0 10px;
  font-size: 0.78rem;
  letter-spacing: 0.1em;
  color: var(--text-faint);
}

.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 0.82rem;
  color: var(--text-dim);
}

.field small {
  display: block;
  margin-top: 3px;
  font-size: 0.72rem;
  color: var(--text-faint);
}

.field--row {
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.field--row input { width: 84px; }

.field input[type='number'] {
  padding: 9px 11px;
  font: inherit;
  font-size: 0.95rem;
  color: var(--text);
  background: rgba(0, 0, 0, 0.25);
  border: 1px solid var(--border);
  border-radius: 12px;
  font-variant-numeric: tabular-nums;
}

.field input[type='number']:focus {
  outline: none;
  border-color: color-mix(in oklab, var(--accent) 55%, transparent);
}

.switches {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.switch {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  font-size: 0.88rem;
  color: var(--text-dim);
  cursor: pointer;
  border-top: 1px solid rgba(255, 255, 255, 0.06);
}

.switch input {
  position: absolute;
  opacity: 0;
  width: 0;
  height: 0;
}

.switch__track {
  position: relative;
  flex: none;
  width: 42px;
  height: 24px;
  background: rgba(255, 255, 255, 0.12);
  border-radius: 999px;
  transition: background 200ms ease;
}

.switch__thumb {
  position: absolute;
  top: 3px;
  left: 3px;
  width: 18px;
  height: 18px;
  background: #fff;
  border-radius: 50%;
  transition: transform 200ms cubic-bezier(0.2, 0.9, 0.3, 1.3);
}

.switch input:checked + .switch__track {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
}

.switch input:checked + .switch__track .switch__thumb {
  transform: translateX(18px);
}

.switch input:focus-visible + .switch__track {
  outline: 2px solid color-mix(in oklab, var(--accent) 70%, transparent);
  outline-offset: 2px;
}

.switch__text small {
  display: block;
  font-size: 0.72rem;
  color: var(--text-faint);
}

.panel__actions {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding-top: 4px;
}

.text-btn {
  padding: 9px 14px;
  font: inherit;
  font-size: 0.83rem;
  color: var(--text-dim);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  cursor: pointer;
  transition: color 160ms ease, background 160ms ease;
}

.text-btn:hover { color: var(--text); background: var(--surface-strong); }

.text-btn--accent {
  color: color-mix(in oklab, var(--accent) 80%, white);
  border-color: color-mix(in oklab, var(--accent) 40%, transparent);
}

.panel__note {
  margin: 0;
  font-size: 0.72rem;
  line-height: 1.6;
  color: var(--text-faint);
}

/* --------------------------------------------------------------- toast -- */

.toast {
  position: fixed;
  z-index: 30;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom));
  padding: 11px 20px;
  font-size: 0.85rem;
  color: var(--text);
  background: rgba(30, 24, 40, 0.94);
  border: 1px solid color-mix(in oklab, var(--accent) 35%, transparent);
  border-radius: 999px;
  box-shadow: var(--shadow);
  transform: translate(-50%, 16px);
  opacity: 0;
  transition: opacity 240ms ease, transform 240ms ease;
}

.toast.is-open {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* --------------------------------------------------------------- 无障碍 -- */

:focus-visible {
  outline: 2px solid color-mix(in oklab, var(--accent) 70%, transparent);
  outline-offset: 3px;
  border-radius: 8px;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

@media (max-width: 420px) {
  .primary-btn { min-width: 140px; height: 54px; padding: 0 22px; }
  .task { flex-direction: column; align-items: stretch; gap: 8px; }
  .shortcuts { display: none; }
}
  </style>
</head>
<body data-phase="focus">
  <div class="glow" aria-hidden="true"></div>

  <div class="app">
    <header class="topbar">
      <h1 class="brand">
        <span class="brand__tomato" aria-hidden="true">🍅</span>
        <span class="brand__text">番茄时钟</span>
      </h1>
      <button type="button" id="settingsBtn" class="icon-btn" aria-label="打开设置" aria-haspopup="dialog" aria-expanded="false" aria-controls="settingsPanel">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3.2"></circle>
          <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.7 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.7h.09A1.7 1.7 0 0 0 10.12 3.14V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15.15 4.7a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.09a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15z"></path>
        </svg>
      </button>
    </header>

    <nav class="modes" role="tablist" aria-label="计时模式">
      <button type="button" class="mode" role="tab" data-phase="focus" aria-selected="true">专注</button>
      <button type="button" class="mode" role="tab" data-phase="short" aria-selected="false">短休息</button>
      <button type="button" class="mode" role="tab" data-phase="long" aria-selected="false">长休息</button>
    </nav>

    <main class="stage">
      <div class="dial">
        <svg class="ring" viewBox="0 0 320 320" aria-hidden="true">
          <defs>
            <linearGradient id="ringGradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="var(--accent)" />
              <stop offset="100%" stop-color="var(--accent-2)" />
            </linearGradient>
          </defs>
          <!-- fill="none" 作为表现属性写死：万一样式表没加载，也不会退化成一个黑色实心圆 -->
          <circle class="ring__track" cx="160" cy="160" r="142" fill="none"></circle>
          <circle class="ring__progress" id="ringProgress" cx="160" cy="160" r="142" fill="none"></circle>
        </svg>

        <div class="dial__center">
          <p class="dial__phase" id="phaseLabel">专注时间</p>
          <p class="dial__time" id="timeDisplay" role="timer" aria-live="off">25:00</p>
          <p class="dial__hint" id="phaseHint">该专注了</p>
        </div>
      </div>

      <div class="controls">
        <button type="button" id="resetBtn" class="icon-btn icon-btn--ghost" aria-label="重置当前阶段（快捷键 R）">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 3.2-6.9"></path>
            <path d="M3 4.5V10h5.5"></path>
          </svg>
        </button>

        <button type="button" id="toggleBtn" class="primary-btn" aria-label="开始专注（快捷键 空格）">
          <svg class="primary-btn__icon primary-btn__icon--play" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" fill="currentColor">
            <path d="M8 5.2c0-.9 1-1.5 1.8-1L18 11a1.2 1.2 0 0 1 0 2l-8.2 6.8c-.8.5-1.8-.1-1.8-1z"></path>
          </svg>
          <svg class="primary-btn__icon primary-btn__icon--pause" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" fill="currentColor">
            <rect x="7" y="5" width="3.6" height="14" rx="1.6"></rect>
            <rect x="13.4" y="5" width="3.6" height="14" rx="1.6"></rect>
          </svg>
          <span class="primary-btn__text" id="toggleText">开始</span>
        </button>

        <button type="button" id="skipBtn" class="icon-btn icon-btn--ghost" aria-label="跳过当前阶段（快捷键 S）">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 5.5 13 12l-8 6.5z" fill="currentColor" stroke="none"></path>
            <path d="M18 5v14"></path>
          </svg>
        </button>
      </div>
    </main>

      focusMinutes: toIntInRange(merged.focusMinutes, DEFAULT_SETTINGS.focusMinutes, 1, 180),
      shortMinutes: toIntInRange(merged.shortMinutes, DEFAULT_SETTINGS.shortMinutes, 1, 60),
      longMinutes: toIntInRange(merged.longMinutes, DEFAULT_SETTINGS.longMinutes, 1, 120),
      longBreakInterval: toIntInRange(merged.longBreakInterval, DEFAULT_SETTINGS.longBreakInterval, 1, 12),

   * @returns {{state: object, completed: null|object}}

        next: upcoming,

   * @returns {{total:number, filled:number}}
   */
  function cycleDots(state, settings) {

 * 番茄时钟 —— 界面与交互（依赖 timer-core.js 提供的纯逻辑）

  var STORAGE_KEY = 'pomodoro-web:v1';

  var els = {

    toggleText: document.getElementById('toggleText'),
    resetBtn: document.getElementById('resetBtn'),
    skipBtn: document.getElementById('skipBtn'),
    ring: document.getElementById('ringProgress'),
    time: document.getElementById('timeDisplay'),
    phaseLabel: document.getElementById('phaseLabel'),
    phaseHint: document.getElementById('phaseHint'),
    modes: Array.prototype.slice.call(document.querySelectorAll('.mode')),
    dots: document.getElementById('dots'),
    focusCount: document.getElementById('focusCount'),
    taskInput: document.getElementById('taskInput'),
    settingsBtn: document.getElementById('settingsBtn'),
    panel: document.getElementById('settingsPanel'),
    scrim: document.getElementById('scrim'),
    closeSettingsBtn: document.getElementById('closeSettingsBtn'),
    resetStatsBtn: document.getElementById('resetStatsBtn'),
    restoreDefaultsBtn: document.getElementById('restoreDefaultsBtn'),
    notifyHint: document.getElementById('notifyHint'),
    toast: document.getElementById('toast'),
    form: document.getElementById('settingsForm'),
    numbers: {
      focusMinutes: document.getElementById('focusMinutes'),
      shortMinutes: document.getElementById('shortMinutes'),
      longMinutes: document.getElementById('longMinutes'),
      longBreakInterval: document.getElementById('longBreakInterval')
    },
    toggles: {
      autoStartBreaks: document.getElementById('autoStartBreaks'),
      autoStartFocus: document.getElementById('autoStartFocus'),
      soundEnabled: document.getElementById('soundEnabled'),
      notifyEnabled: document.getElementById('notifyEnabled')

  var closeTimer = null;

    var msg = finished.emoji + ' ' + finished.name + '结束';
    if (completed.next === 'short') msg += '，去休息 ' + settings.shortMinutes + ' 分钟吧';
    else if (completed.next === 'long') msg += '，进入 ' + settings.longMinutes + ' 分钟长休息';
    else msg += '，回到专注';

    playChime(completed.phase);
    toast(msg, 4200);
    notify(finished.emoji + ' ' + finished.name + '结束', '下一步：' + upcoming.name + (completed.autoStarted ? '（已自动开始）' : ''));

    if (completed.autoStarted) els.toggleText.textContent = '暂停';
    save();
  }

  /** 推进一次状态机；返回是否刚刚完成了某个阶段。 */
  function step() {
    if (!state.running) return false;
    var result = core.tick(state, Date.now(), settings);
    if (result.completed) {
      state = result.state;
      handleCompleted(result.completed);
      return true;
    }
    if (result.state !== state) state = result.state;
    return false;
  }

  function loop() {
    step();
    render(Date.now(), false);
    requestAnimationFrame(loop);
  }

  /* ------------------------------------------------------ 用户操作 -- */

  function toggle() {
    ensureAudio();
    var wasRunning = state.running;
    // 极端情况下暂停时恰好走到 0，先补一个完整时长再开始
    if (!wasRunning && core.remainingMs(state, Date.now()) <= 0) {
      state = core.reset(state, settings);
    }
    state = core.toggle(state, Date.now());
    if (wasRunning) {
      toast('已暂停 ⏸');
    } else {
      toast(core.PHASE_TEXT[state.phase].emoji + ' 开始' + core.PHASE_TEXT[state.phase].name);
    }
    render(Date.now(), true);
    save();
  }

  function resetTimer() {
    state = core.reset(state, settings);
    toast('已重置为 ' + core.formatTime(state.remainingMs));
    render(Date.now(), true);
    save();
  }

  function skipPhase() {
    var from = state.phase;
    state = core.skip(state, settings);
    toast('跳过' + core.PHASE_TEXT[from].name + ' → ' + core.PHASE_TEXT[state.phase].name);
    render(Date.now(), true);
    save();
  }

  function setPhase(phase) {
    if (phase === state.phase) return;
    state = core.switchPhase(state, phase, settings);
    render(Date.now(), true);
    save();
  }

  /* ------------------------------------------------------- 设置面板 -- */

  function syncForm() {
    Object.keys(els.numbers).forEach(function (key) {
      els.numbers[key].value = String(settings[key]);
    });
    Object.keys(els.toggles).forEach(function (key) {
      els.toggles[key].checked = Boolean(settings[key]);
    });
    updateNotifyHint();
  }

  /** 修改时长后：若当前阶段还没开始计时就同步剩余时间，否则只夹紧不越界。 */
  function applyDurationChange() {
    var duration = core.phaseDurationMs(state.phase, settings);
    var previous = state.durationMs;
    state = Object.assign({}, state, { durationMs: duration });

    if (!state.running) {
      if (state.remainingMs >= previous || state.remainingMs > duration) {
        state = Object.assign({}, state, { remainingMs: duration });
      }
    } else if (core.remainingMs(state, Date.now()) > duration) {
      state = Object.assign({}, state, { endAt: Date.now() + duration });
    }
    render(Date.now(), true);
    save();
  }

  function readNumberInput(input, key) {
    var draft = Object.assign({}, settings);
    draft[key] = input.value;
    var value = core.normalizeSettings(draft)[key];
    input.value = String(value);
    settings[key] = value;
    return value;
  }

  function openPanel() {
    clearTimeout(closeTimer);
    els.panel.hidden = false;
    els.scrim.hidden = false;
    void els.panel.offsetWidth; // 强制重排，保证入场过渡生效（不依赖 rAF）
    els.panel.classList.add('is-open');
    els.scrim.classList.add('is-open');
    els.settingsBtn.setAttribute('aria-expanded', 'true');
    var first = els.numbers.focusMinutes;
    if (first) first.focus();
  }

  function closePanel() {
    els.panel.classList.remove('is-open');
    els.scrim.classList.remove('is-open');
    els.settingsBtn.setAttribute('aria-expanded', 'false');
    clearTimeout(closeTimer);
    closeTimer = setTimeout(function () {
      els.panel.hidden = true;
      els.scrim.hidden = true;
    }, 220);
    els.settingsBtn.focus();
  }

  function toastConfirmResetStats() {
    if (window.confirm('确定要清空统计吗？已完成番茄数与周期进度都会归零。')) {
      stats = { date: todayKey(), count: 0 };
      state = Object.assign({}, state, { focusDone: 0 });
      render(Date.now(), true);
      save();
      toast('统计已清空');
    }
  }

  /* -------------------------------------------------------- 事件绑定 -- */

  els.toggleBtn.addEventListener('click', toggle);
  els.resetBtn.addEventListener('click', resetTimer);
  els.skipBtn.addEventListener('click', skipPhase);
  els.modes.forEach(function (btn) {
    btn.addEventListener('click', function () { setPhase(btn.dataset.phase); });
  });

  els.settingsBtn.addEventListener('click', openPanel);
  els.closeSettingsBtn.addEventListener('click', closePanel);
  els.scrim.addEventListener('click', closePanel);
  els.resetStatsBtn.addEventListener('click', toastConfirmResetStats);

  els.restoreDefaultsBtn.addEventListener('click', function () {
    settings = core.normalizeSettings(core.DEFAULT_SETTINGS);
    syncForm();
    applyDurationChange();
    toast('已恢复默认设置');
  });

  Object.keys(els.numbers).forEach(function (key) {
    els.numbers[key].addEventListener('change', function () {
      readNumberInput(els.numbers[key], key);
      applyDurationChange();
    });
  });

  els.toggles.autoStartBreaks.addEventListener('change', function () {
    settings.autoStartBreaks = els.toggles.autoStartBreaks.checked;
    save();
  });

  els.toggles.autoStartFocus.addEventListener('change', function () {
    settings.autoStartFocus = els.toggles.autoStartFocus.checked;
    save();
  });

  els.toggles.soundEnabled.addEventListener('change', function () {
    settings.soundEnabled = els.toggles.soundEnabled.checked;
    if (settings.soundEnabled) {
      ensureAudio();
      playChime('focus');
    }
    save();
  });

  els.toggles.notifyEnabled.addEventListener('change', function () {
    var want = els.toggles.notifyEnabled.checked;
    if (!want) {
      settings.notifyEnabled = false;
      save();
      return;
    }
    if (!('Notification' in window)) {
      els.toggles.notifyEnabled.checked = false;
      toast('当前环境不支持桌面通知');
      return;
    }
    if (Notification.permission === 'granted') {
      settings.notifyEnabled = true;
      updateNotifyHint();
      save();
      return;
    }
    if (Notification.permission === 'denied') {
      els.toggles.notifyEnabled.checked = false;
      updateNotifyHint();
      toast('通知权限被拒绝，请在浏览器站点设置里允许');
      return;
    }
    Notification.requestPermission().then(function (permission) {
      settings.notifyEnabled = permission === 'granted';
      els.toggles.notifyEnabled.checked = settings.notifyEnabled;
      updateNotifyHint();
      toast(settings.notifyEnabled ? '已开启桌面通知' : '未获得通知权限');
      save();
    });
  });

  els.taskInput.addEventListener('input', save);

  document.addEventListener('keydown', function (event) {
    var tag = (event.target && event.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || event.isComposing || event.metaKey || event.ctrlKey || event.altKey) return;

    if (event.key === 'Escape' && !els.panel.hidden) {
      closePanel();
      return;
    }
    if (event.key === ' ' || event.key === 'Spacebar') {
      event.preventDefault();
      toggle();
      return;
    }
    var key = event.key.toLowerCase();
    if (key === 'r') { event.preventDefault(); resetTimer(); }
    else if (key === 's') { event.preventDefault(); skipPhase(); }
    else if (key === '1') setPhase('focus');
    else if (key === '2') setPhase('short');
    else if (key === '3') setPhase('long');
  });

  // 回到前台时立即补算流逝的时间
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) {
      step();
      render(Date.now(), true);
    }
  });

  // 后台标签页里 rAF 会被节流甚至暂停，用定时器兜底保证计时与界面都不停摆
  setInterval(function () {
    step();
    render(Date.now(), false);
  }, 500);

  window.addEventListener('beforeunload', save);

  /* ------------------------------------------------------------ 启动 -- */

  load();
  syncForm();
  render(Date.now(), true);
  requestAnimationFrame(loop);
})();
  </script>
</body>
</html>
